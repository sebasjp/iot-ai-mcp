[project]
name = "rack-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.44.11",
    "fastmcp>=4.1.8",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "moto[dynamodb]>=5.2.6",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
