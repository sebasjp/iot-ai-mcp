[project]
name = "rack-vision"
version = "0.1.0"
description = "Clasificador de la puerta del rack en la Raspberry Pi 3 (Edge Impulse .eim) -> AWS IoT"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.2.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
